[project]
name = "foveayolo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Connor Feeney", email = "connor.w.feeney@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "opencv-python>=5.0.0.93",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
